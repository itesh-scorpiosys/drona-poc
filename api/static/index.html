<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vyasa - Drona Live Classroom</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%2312162b'/><path d='M32 12c7 10 10 16 10 22a10 10 0 0 1-20 0c0-6 3-12 10-22z' fill='%23f4b23e'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Spectral:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --ink: #12162b;        /* page */
    --dusk: #1b2040;       /* panels */
    --dusk-2: #232a52;     /* raised surfaces */
    --line: #2f376a;
    --chalk: #ebe9f7;      /* main text */
    --mist: #9ea4cc;       /* secondary text */
    --marigold: #f4b23e;   /* Vyasa speaking, primary action */
    --leaf: #5cc79f;       /* listening, connected */
    --ember: #e8666c;      /* leave, errors */
    --serif: "Spectral", Georgia, "Times New Roman", serif;
    --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--chalk);
    font: 400 1rem/1.5 var(--sans);
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    max-width: 1180px; margin: 0 auto; padding: 1.25rem 1.5rem 0.75rem;
  }
  .brand { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
  .brand h1 { margin: 0; font: 600 1.6rem/1 var(--serif); letter-spacing: 0.01em; }
  .brand p { margin: 0; color: var(--mist); font-size: 0.95rem; }
  .conn {
    margin-left: auto; display: inline-flex; align-items: center; gap: 0.5rem;
    font-size: 0.9rem; color: var(--mist);
  }
  .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: #5a6090; }
  .conn[data-state="connected"] .dot { background: var(--leaf); }
  .conn[data-state="connecting"] .dot,
  .conn[data-state="reconnecting"] .dot { background: var(--marigold); }
  .conn[data-state="error"] .dot { background: var(--ember); }
  .conn .clock { font-variant-numeric: tabular-nums; color: var(--chalk); }
  .conn .phase { padding: 0.15rem 0.6rem; border-radius: 999px; border: 1px solid var(--line); color: var(--chalk); font-size: 0.82rem; }
  .conn .phase[data-phase="qa"] { border-color: var(--leaf); color: #bff0dc; }
  .conn .phase[data-phase="wrap"] { border-color: var(--marigold); color: #ffe2ad; }
  .stage[data-state="yourturn"] { box-shadow: 0 0 0 3px var(--leaf), 0 0 60px -10px rgba(92,199,159,0.6); }
  .stage[data-state="yourturn"] .lamp .core { filter: none; }
  .stage[data-state="yourturn"] .lamp .ring { border-color: var(--leaf); animation: listen 1.4s ease-in-out infinite; }
  .stage[data-state="ended"] .lamp .core { filter: saturate(0.3) brightness(0.45); }
  .roster .floor { color: var(--leaf); font-size: 0.85rem; font-weight: 600; }

  /* ---------- layout ---------- */
  main {
    max-width: 1180px; margin: 0 auto; padding: 0.5rem 1.5rem 1.5rem;
    display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 1.5rem;
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .notice {
    grid-column: 1 / -1; margin: 0; padding: 0.75rem 1rem; border-radius: 10px;
    background: rgba(232, 102, 108, 0.12); border: 1px solid rgba(232, 102, 108, 0.45);
    color: #ffc9cb;
  }
  .notice.info { background: rgba(244, 178, 62, 0.1); border-color: rgba(244, 178, 62, 0.4); color: #ffe2ad; }

  /* ---------- stage: the one bold element ---------- */
  .stage-col { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
  .stage {
    position: relative; aspect-ratio: 16 / 10; border-radius: 20px; overflow: hidden;
    background:
      radial-gradient(120% 90% at 50% 110%, #2b2150 0%, transparent 60%),
      radial-gradient(90% 70% at 50% 0%, #1c2448 0%, transparent 70%),
      var(--dusk);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    transition: box-shadow 400ms ease;
  }
  .stage[data-state="speaking"] { box-shadow: 0 0 0 2px var(--marigold), 0 0 60px -10px rgba(244,178,62,0.55); }
  .stage[data-state="listening"] { box-shadow: 0 0 0 2px rgba(92,199,159,0.7); }
  .stage[data-state="thinking"] { box-shadow: 0 0 0 2px rgba(244,178,62,0.45); }

  .stage video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000;
  }

  /* the lamp: shown whenever there is no avatar video */
  .lamp { position: relative; width: min(38%, 220px); aspect-ratio: 1; }
  .lamp .halo {
    position: absolute; inset: -30%; border-radius: 50%;
    background: radial-gradient(circle, rgba(244,178,62,0.28) 0%, rgba(244,178,62,0) 65%);
    opacity: 0.25; transition: opacity 500ms ease;
  }
  .lamp .core {
    position: absolute; inset: 18%; border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, #ffe6ac 0%, #f4b23e 38%, #b86a1c 72%, #5b2f18 100%);
    filter: saturate(0.4) brightness(0.55); transition: filter 500ms ease, transform 500ms ease;
  }
  .lamp .ring {
    position: absolute; inset: 6%; border-radius: 50%;
    border: 2px solid transparent; transition: border-color 400ms ease;
  }
  .stage[data-state="waiting"] .lamp .core { filter: saturate(0.6) brightness(0.7); }
  .stage[data-state="listening"] .lamp .core { filter: none; }
  .stage[data-state="listening"] .lamp .ring { border-color: rgba(92,199,159,0.65); animation: listen 2.8s ease-in-out infinite; }
  .stage[data-state="thinking"] .lamp .core { filter: brightness(0.9); }
  .stage[data-state="thinking"] .lamp .ring { border-top-color: var(--marigold); border-right-color: rgba(244,178,62,0.4); animation: spin 1.1s linear infinite; }
  .stage[data-state="speaking"] .lamp .halo { opacity: 1; animation: breathe 1.6s ease-in-out infinite; }
  .stage[data-state="speaking"] .lamp .core { filter: brightness(1.12); animation: flicker 1.6s ease-in-out infinite; }

  @keyframes listen { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: .5; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { transform: scale(0.94); } 50% { transform: scale(1.06); } }
  @keyframes flicker { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }

  .caption {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 1.1rem 1.4rem;
    background: linear-gradient(to top, rgba(18,22,43,0.92), rgba(18,22,43,0));
    font: 500 italic 1.35rem/1.2 var(--serif);
  }
  .caption small { display: block; font: 400 0.9rem/1.4 var(--sans); color: var(--mist); margin-top: 0.2rem; font-style: normal; }

  /* ---------- controls ---------- */
  .controls { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.7rem 1.15rem; border-radius: 999px; border: 1px solid var(--line);
    background: var(--dusk-2); color: var(--chalk);
    font: 500 0.98rem/1 var(--sans); cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
  }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn:hover { border-color: #4a5392; }
  .btn:focus-visible { outline: 2px solid var(--marigold); outline-offset: 3px; }
  .btn-primary { background: var(--marigold); border-color: var(--marigold); color: #2a1a05; font-weight: 600; }
  .btn-primary:hover { background: #ffc35c; border-color: #ffc35c; }
  .btn-leave { background: transparent; border-color: rgba(232,102,108,0.6); color: #ffb3b6; margin-left: auto; }
  .btn-leave:hover { background: rgba(232,102,108,0.12); border-color: var(--ember); }
  .btn[aria-pressed="true"].btn-mic { background: rgba(232,102,108,0.16); border-color: rgba(232,102,108,0.6); }
  .btn[aria-pressed="true"].btn-hand { background: rgba(244,178,62,0.18); border-color: var(--marigold); color: #ffe2ad; }
  .btn-mic.talking { box-shadow: 0 0 0 3px rgba(92,199,159,0.45); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  /* ---------- side panel ---------- */
  .side { display: flex; flex-direction: column; gap: 1rem; min-width: 0; min-height: 0; }
  .panel {
    background: var(--dusk); border: 1px solid var(--line); border-radius: 14px;
    display: flex; flex-direction: column; min-height: 0;
  }
  .panel h2 {
    margin: 0; padding: 0.9rem 1.1rem 0.6rem; font: 600 1.05rem/1.2 var(--serif);
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
  }
  .panel h2 span { font: 400 0.85rem/1 var(--sans); color: var(--mist); }

  .roster { list-style: none; margin: 0; padding: 0 0.6rem 0.7rem; }
  .roster li {
    display: flex; align-items: center; gap: 0.65rem; padding: 0.45rem 0.5rem; border-radius: 8px;
  }
  .roster .avatar {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: var(--dusk-2); border: 1px solid var(--line); font-weight: 600; font-size: 0.85rem;
  }
  .roster li.speaking .avatar { border-color: var(--leaf); box-shadow: 0 0 0 2px rgba(92,199,159,0.35); }
  .roster li.vyasa .avatar { background: rgba(244,178,62,0.15); border-color: rgba(244,178,62,0.5); color: var(--marigold); }
  .roster .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .roster .who em { color: var(--mist); font-style: normal; font-size: 0.85rem; margin-left: 0.3rem; }
  .roster .hand { color: var(--marigold); font-size: 0.85rem; font-weight: 600; }

  .transcript-panel { flex: 1; min-height: 320px; max-height: calc(100vh - 170px); }
  @media (max-width: 860px) { .transcript-panel { max-height: 60vh; } }
  .transcript { flex: 1; overflow-y: auto; padding: 0.3rem 1.1rem 1.1rem; scroll-behavior: smooth; }
  .transcript .empty { color: var(--mist); margin: 1.5rem 0; max-width: 32ch; }
  .line { margin: 0 0 0.9rem; max-width: 60ch; }
  .line .speaker { display: block; font-size: 0.8rem; font-weight: 600; color: var(--mist); margin-bottom: 0.15rem; }
  .line.vyasa .speaker { color: var(--marigold); }
  .line.you .speaker { color: var(--leaf); }
  .line .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .line.vyasa .text { font: 400 1.02rem/1.6 var(--serif); }
  .line.interim .text { color: var(--mist); }

  #audioSink { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Vyasa</h1>
    <p id="sessionLabel">Drona live classroom</p>
  </div>
  <div class="conn" id="conn" data-state="offline" role="status" aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <span id="connText">Not joined</span>
    <span class="clock" id="clock" hidden>00:00</span>
    <span class="phase" id="phasePill" hidden></span>
  </div>
</header>

<main>
  <p class="notice" id="notice" hidden></p>

  <section class="stage-col">
    <div class="stage" id="stage" data-state="idle">
      <div class="lamp" id="lamp" aria-hidden="true">
        <div class="halo"></div><div class="core"></div><div class="ring"></div>
      </div>
      <video id="agentVideo" autoplay playsinline hidden></video>
      <div class="caption" aria-live="polite">
        <span id="stateText">Join the class to begin</span>
        <small id="stateHint">Vyasa will greet you as soon as you connect.</small>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="joinBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        Join class
      </button>
      <button class="btn btn-mic" id="muteBtn" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span id="muteLabel">Mute</span>
      </button>
      <button class="btn btn-hand" id="raiseBtn" aria-pressed="false" disabled hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8a8 8 0 0 0 8 8h1a7 7 0 0 0 7-7v-3a2 2 0 0 0-4 0"/></svg>
        <span id="raiseLabel">Raise hand</span>
      </button>
      <button class="btn" id="audioBtn" hidden>Turn on sound</button>
      <button class="btn btn-leave" id="leaveBtn" disabled>Leave</button>
    </div>
  </section>

  <aside class="side">
    <div class="panel" id="rosterPanel" hidden>
      <h2>In class <span id="rosterCount"></span></h2>
      <ul class="roster" id="roster"></ul>
    </div>
    <div class="panel transcript-panel">
      <h2>Conversation</h2>
      <div class="transcript" id="transcript" aria-live="polite">
        <p class="empty" id="transcriptEmpty">What you and Vyasa say will appear here as you talk.</p>
      </div>
    </div>
  </aside>
</main>

<div id="audioSink"></div>

<script>
// URL: /?learner=A&lesson=1&mode=1to1   or   /?learner=B&lesson=1&mode=group&slot=s1
const params = new URLSearchParams(window.location.search);
const learner_id = params.get("learner");
const lesson_id = params.get("lesson");
const mode = params.get("mode") || "1to1";
const slot_id = params.get("slot");
const isGroup = mode === "group";

const LK = window.LivekitClient;
const $ = (id) => document.getElementById(id);
const els = {
  conn: $("conn"), connText: $("connText"), clock: $("clock"), notice: $("notice"),
  stage: $("stage"), lamp: $("lamp"), video: $("agentVideo"),
  stateText: $("stateText"), stateHint: $("stateHint"), sessionLabel: $("sessionLabel"),
  joinBtn: $("joinBtn"), muteBtn: $("muteBtn"), muteLabel: $("muteLabel"),
  raiseBtn: $("raiseBtn"), raiseLabel: $("raiseLabel"), audioBtn: $("audioBtn"), leaveBtn: $("leaveBtn"),
  rosterPanel: $("rosterPanel"), roster: $("roster"), rosterCount: $("rosterCount"),
  transcript: $("transcript"), transcriptEmpty: $("transcriptEmpty"), audioSink: $("audioSink"),
};

let room = null;
let micEnabled = true;
let handRaised = false;
let clockTimer = null;
const hands = new Set();          // identities with a raised hand
let phase = null;                 // lecture | qa | wrap (sent by Vyasa in group mode)
let floorIdentity = null;         // learner Vyasa is listening to right now
let classEnded = false;
const segments = new Map();       // transcript segment id -> line element

// ---------- small helpers ----------
function showNotice(text, kind) {
  els.notice.textContent = text;
  els.notice.classList.toggle("info", kind === "info");
  els.notice.hidden = !text;
}
function setConn(state, text) {
  els.conn.dataset.state = state;
  els.connText.textContent = text;
}
function isAgent(p) {
  if (!p) return false;
  if (p.isAgent === true) return true;
  return !!(LK.ParticipantKind && p.kind === LK.ParticipantKind.AGENT);
}
function displayName(p) { return p.name || p.identity; }
function initial(name) { return (name || "?").trim().charAt(0).toUpperCase(); }

// ---------- session label ----------
els.sessionLabel.textContent = lesson_id
  ? `Lesson ${lesson_id}, ${isGroup ? `group session${slot_id ? " " + slot_id : ""}` : "one-to-one"}`
  : "Drona live classroom";
if (isGroup) { els.raiseBtn.hidden = false; els.rosterPanel.hidden = false; }

if (!learner_id || !lesson_id) {
  showNotice("This link is missing the learner or lesson. Open it as ?learner=A&lesson=1&mode=1to1, or add &mode=group&slot=s1 for a group session.");
  els.joinBtn.disabled = true;
}

// ---------- Vyasa's presence and state ----------
function vyasaParticipants() {
  if (!room) return [];
  return [...room.remoteParticipants.values()].filter(isAgent);
}
function agentState() {
  for (const p of vyasaParticipants()) {
    const s = p.attributes && p.attributes["lk.agent.state"];
    if (s) return s;
  }
  return vyasaParticipants().length ? "listening" : null;
}
const STATE_COPY = {
  idle:      ["Join the class to begin", "Vyasa will greet you as soon as you connect."],
  waiting:   ["Vyasa is on the way", "This usually takes a few seconds."],
  initializing: ["Vyasa is getting ready", "Your lesson notes are loading."],
  listening: ["Vyasa is listening", "Go ahead and speak, or ask a question."],
  thinking:  ["Vyasa is thinking", "Working out a reply."],
  speaking:  ["Vyasa is speaking", "You can interrupt at any time."],
  yourturn:  ["Your turn to speak", "Vyasa is listening to you now. Go ahead."],
  ended:     ["Class has ended", "Your summary and practice task are waiting in Cowork."],
};
const PHASE_LABEL = { lecture: "Lecture", qa: "Questions", wrap: "Wrapping up" };
function renderStage() {
  let state = "idle";
  if (room) state = agentState() || "waiting";
  if (room && floorIdentity && floorIdentity === room.localParticipant.identity) state = "yourturn";
  if (classEnded) state = "ended";
  els.stage.dataset.state = state;
  const [title, hint] = STATE_COPY[state] || STATE_COPY.listening;
  els.stateText.textContent = title;
  let h = hint;
  if (isGroup && room && state === "speaking") h = "Press Raise hand if you have a question.";
  if (isGroup && handRaised) h = phase === "qa" ? "Your hand is raised. Vyasa is taking questions in order." : "Your hand is raised. Vyasa takes questions near the end.";
  if (room && !micEnabled && state !== "waiting" && state !== "ended") h = state === "yourturn" ? "You're muted. Unmute to answer Vyasa." : "Your microphone is muted. Unmute to talk to Vyasa.";
  els.stateHint.textContent = h;
}

// ---------- roster (group mode) ----------
function renderRoster() {
  if (!isGroup) return;
  els.roster.innerHTML = "";
  if (!room) { els.rosterCount.textContent = ""; return; }
  const people = [room.localParticipant, ...room.remoteParticipants.values()];
  const speaking = new Set((room.activeSpeakers || []).map((p) => p.identity));
  let learners = 0;
  const seenVyasa = { shown: false };
  for (const p of people) {
    const agent = isAgent(p);
    if (agent) { if (seenVyasa.shown) continue; seenVyasa.shown = true; } else learners++;
    const li = document.createElement("li");
    if (agent) li.classList.add("vyasa");
    if (speaking.has(p.identity)) li.classList.add("speaking");
    const name = agent ? "Vyasa" : displayName(p);
    li.innerHTML = `<span class="avatar"></span><span class="who"></span>`;
    li.querySelector(".avatar").textContent = initial(name);
    const who = li.querySelector(".who");
    who.textContent = name;
    if (p === room.localParticipant) {
      const em = document.createElement("em"); em.textContent = "you"; who.appendChild(em);
    }
    if (!agent && floorIdentity === p.identity) {
      const fl = document.createElement("span"); fl.className = "floor"; fl.textContent = "Speaking";
      li.appendChild(fl);
    } else if (!agent && hands.has(p.identity)) {
      const hand = document.createElement("span"); hand.className = "hand"; hand.textContent = "Hand raised";
      li.appendChild(hand);
    }
    els.roster.appendChild(li);
  }
  els.rosterCount.textContent = `${learners} learner${learners === 1 ? "" : "s"}`;
}

// ---------- transcript ----------
function speakerFor(attrs, senderIdentity) {
  const trackId = attrs["lk.transcribed_track_id"];
  const lp = room.localParticipant;
  if (trackId) {
    for (const pub of lp.trackPublications.values()) if (pub.trackSid === trackId) return { cls: "you", name: "You" };
    for (const p of room.remoteParticipants.values()) {
      for (const pub of p.trackPublications.values()) {
        if (pub.trackSid === trackId) return isAgent(p) ? { cls: "vyasa", name: "Vyasa" } : { cls: "peer", name: displayName(p) };
      }
    }
  }
  if (senderIdentity === lp.identity) return { cls: "you", name: "You" };
  const p = room.remoteParticipants.get(senderIdentity);
  if (!p || isAgent(p)) return { cls: "vyasa", name: "Vyasa" };
  return { cls: "peer", name: displayName(p) };
}
function lineFor(segId, who) {
  let line = segments.get(segId);
  if (!line) {
    els.transcriptEmpty.hidden = true;
    line = document.createElement("p");
    line.className = `line ${who.cls} interim`;
    line.innerHTML = `<span class="speaker"></span><span class="text"></span>`;
    line.querySelector(".speaker").textContent = who.name;
    els.transcript.appendChild(line);
    segments.set(segId, line);
  }
  return line;
}
function nearBottom() {
  const t = els.transcript;
  return t.scrollHeight - t.scrollTop - t.clientHeight < 80;
}
function registerTranscripts(r) {
  if (typeof r.registerTextStreamHandler !== "function") return;
  r.registerTextStreamHandler("lk.transcription", async (reader, participantInfo) => {
    const attrs = (reader.info && reader.info.attributes) || {};
    const segId = attrs["lk.segment_id"] || reader.info.id;
    const line = lineFor(segId, speakerFor(attrs, participantInfo.identity));
    const textEl = line.querySelector(".text");
    let text = "";
    const stick = nearBottom();
    for await (const chunk of reader) {
      text += chunk;
      textEl.textContent = text.replace(/\*\*/g, "");   // hide markdown bold from spoken replies
      if (stick) els.transcript.scrollTop = els.transcript.scrollHeight;
    }
    if (attrs["lk.transcription_final"] !== "false") line.classList.remove("interim");
  });
}

// ---------- media ----------
function attachTrack(track, participant) {
  if (track.kind === "video") {
    if (!isAgent(participant)) return;              // only Vyasa's avatar goes on the stage
    track.attach(els.video);
    els.video.hidden = false;
    els.lamp.hidden = true;
  } else if (track.kind === "audio") {
    const el = track.attach();                        // one element per track, so voices never replace each other
    els.audioSink.appendChild(el);
  }
}
function detachTrack(track) {
  track.detach().forEach((el) => { if (el !== els.video) el.remove(); });
  if (track.kind === "video" && !els.video.srcObject) { els.video.hidden = true; els.lamp.hidden = false; }
}

// ---------- clock ----------
function startClock() {
  const start = Date.now();
  els.clock.hidden = false;
  clockTimer = setInterval(() => {
    const s = Math.floor((Date.now() - start) / 1000);
    els.clock.textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  }, 1000);
}
function stopClock() { clearInterval(clockTimer); clockTimer = null; els.clock.hidden = true; els.clock.textContent = "00:00"; }

// ---------- token ----------
async function fetchToken() {
  const body = { learner_id, lesson_id, mode };
  if (isGroup) body.slot_id = slot_id;
  const resp = await fetch("/token", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!resp.ok) {
    const detail = await resp.text();
    throw new Error(`Couldn't get a room pass from the server (${resp.status}). ${detail}`);
  }
  return resp.json();
}

// ---------- join / leave ----------
async function join() {
  els.joinBtn.disabled = true;
  showNotice("");
  classEnded = false; floorIdentity = null;
  setConn("connecting", "Connecting");
  try {
    const { url, token } = await fetchToken();
    room = new LK.Room({ adaptiveStream: true, dynacast: true });
    const E = LK.RoomEvent;

    room.on(E.TrackSubscribed, (track, pub, p) => attachTrack(track, p));
    room.on(E.TrackUnsubscribed, (track) => detachTrack(track));
    room.on(E.ParticipantConnected, () => { renderStage(); renderRoster(); });
    room.on(E.ParticipantDisconnected, (p) => { hands.delete(p.identity); renderStage(); renderRoster(); });
    room.on(E.ParticipantAttributesChanged, () => renderStage());
    room.on(E.ActiveSpeakersChanged, (speakers) => {
      const talking = speakers.some((p) => p === room.localParticipant);
      els.muteBtn.classList.toggle("talking", talking && micEnabled);
      renderRoster();
    });
    room.on(E.DataReceived, (payload, p) => {
      let msg; try { msg = JSON.parse(new TextDecoder().decode(payload)); } catch { return; }
      if (msg.type === "phase") { setPhase(msg.phase); return; }
      if (msg.type === "floor") { floorIdentity = msg.identity || null; renderStage(); renderRoster(); return; }
      if (msg.type === "class_ended") { classEnded = true; setPhase(null); renderStage(); return; }
      const who = msg.identity || (p && p.identity);
      if (!who) return;
      if (msg.type === "raise_hand") hands.add(who);
      if (msg.type === "lower_hand") hands.delete(who);
      if (who === room.localParticipant.identity && msg.type === "lower_hand") setHand(false, false);
      renderRoster();
    });
    room.on(E.AudioPlaybackStatusChanged, () => { els.audioBtn.hidden = room.canPlaybackAudio; });
    room.on(E.Reconnecting, () => { setConn("reconnecting", "Connection lost, reconnecting"); showNotice("Your connection dropped. Reconnecting now; stay on this page.", "info"); });
    room.on(E.Reconnected, () => { setConn("connected", "Connected"); showNotice(""); });
    room.on(E.Disconnected, () => cleanup(classEnded ? "Class has ended" : "Left the class."));

    registerTranscripts(room);

    await room.connect(url, token);
    setConn("connected", "Connected");
    startClock();
    try { await room.startAudio(); } catch {}
    els.audioBtn.hidden = room.canPlaybackAudio;

    try {
      await room.localParticipant.setMicrophoneEnabled(true);
    } catch (micErr) {
      micEnabled = false;
      showNotice("Your browser blocked the microphone. Allow microphone access for this site, then choose Unmute.");
    }
    updateMuteButton();

    els.muteBtn.disabled = false;
    els.raiseBtn.disabled = !isGroup;
    els.leaveBtn.disabled = false;
    // Vyasa may already be in the room (group sessions); pick up existing tracks.
    room.remoteParticipants.forEach((p) => p.trackPublications.forEach((pub) => { if (pub.track) attachTrack(pub.track, p); }));
    renderStage();
    renderRoster();
  } catch (err) {
    console.error(err);
    setConn("error", "Couldn't connect");
    showNotice(err.message || "Couldn't join the class. Check that the API and agent are running, then try again.");
    if (room) { room.disconnect(); room = null; }
    els.joinBtn.disabled = !(learner_id && lesson_id);
    renderStage();
  }
}

function setPhase(p) {
  phase = p;
  const pill = document.getElementById("phasePill");
  pill.hidden = !p;
  pill.dataset.phase = p || "";
  pill.textContent = p ? PHASE_LABEL[p] || p : "";
  if (isGroup && room) els.raiseBtn.disabled = p === "wrap";
  if (p === "wrap" && handRaised) setHand(false, false);
  renderStage();
}

function updateMuteButton() {
  els.muteLabel.textContent = micEnabled ? "Mute" : "Unmute";
  els.muteBtn.setAttribute("aria-pressed", String(!micEnabled));
  if (!micEnabled) els.muteBtn.classList.remove("talking");
  renderStage();
}
async function toggleMute() {
  if (!room) return;
  try {
    await room.localParticipant.setMicrophoneEnabled(!micEnabled);
    micEnabled = !micEnabled;
    showNotice("");
  } catch {
    showNotice("Your browser blocked the microphone. Allow microphone access for this site and try again.");
  }
  updateMuteButton();
}

function setHand(raised, broadcast = true) {
  handRaised = raised;
  els.raiseLabel.textContent = raised ? "Lower hand" : "Raise hand";
  els.raiseBtn.setAttribute("aria-pressed", String(raised));
  if (room) {
    const me = room.localParticipant.identity;
    raised ? hands.add(me) : hands.delete(me);
    if (broadcast) {
      const payload = new TextEncoder().encode(JSON.stringify({ type: raised ? "raise_hand" : "lower_hand", identity: me }));
      room.localParticipant.publishData(payload, { reliable: true });
    }
  }
  renderRoster();
  renderStage();
}

function cleanup(message) {
  stopClock();
  floorIdentity = null;
  setPhase(null);
  hands.clear();
  handRaised = false;
  els.raiseLabel.textContent = "Raise hand";
  els.raiseBtn.setAttribute("aria-pressed", "false");
  els.audioSink.innerHTML = "";
  els.video.srcObject = null; els.video.hidden = true; els.lamp.hidden = false;
  room = null;
  micEnabled = true;
  updateMuteButton();
  els.joinBtn.disabled = !(learner_id && lesson_id);
  els.muteBtn.disabled = true;
  els.raiseBtn.disabled = true;
  els.leaveBtn.disabled = true;
  els.audioBtn.hidden = true;
  setConn("offline", message || "Not joined");
  renderStage();
  renderRoster();
}

function leave() {
  if (room && handRaised) setHand(false);
  if (room) room.disconnect();   // triggers Disconnected -> cleanup
  else cleanup("Left the class.");
}

els.joinBtn.addEventListener("click", join);
els.muteBtn.addEventListener("click", toggleMute);
els.raiseBtn.addEventListener("click", () => setHand(!handRaised));
els.audioBtn.addEventListener("click", async () => { try { await room.startAudio(); } catch {} els.audioBtn.hidden = room && room.canPlaybackAudio; });
els.leaveBtn.addEventListener("click", leave);

renderStage();
</script>
</body>
